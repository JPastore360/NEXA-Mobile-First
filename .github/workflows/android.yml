name: Build NEXA Functional

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar NEXA
        run: |
          rm -rf nexa
          mkdir -p nexa/app/src/main/java/com/jpastore/nexa
          mkdir -p nexa/app/src/main/res/values

          cat > nexa/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NEXA"
          include(":app")
          EOF

          cat > nexa/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > nexa/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > nexa/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.jpastore.nexa"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.jpastore.nexa"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 3
                  versionName = "0.3.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures { compose = true }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material:material-icons-extended")
          }
          EOF

          cat > nexa/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.Nexa" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">#050B09</item>
                  <item name="android:navigationBarColor">#050B09</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > nexa/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <queries>
                  <package android:name="com.whatsapp"/>
                  <package android:name="com.instagram.android"/>
                  <package android:name="com.facebook.katana"/>
              </queries>

              <application
                  android:theme="@style/Theme.Nexa"
                  android:label="NEXA">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > nexa/app/src/main/java/com/jpastore/nexa/MainActivity.kt <<'EOF'
          package com.jpastore.nexa

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.speech.RecognizerIntent
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import java.text.SimpleDateFormat
          import java.util.*

          private val BG = Color(0xFF050B09)
          private val PANEL = Color(0xFF0C1713)
          private val PANEL2 = Color(0xFF12221C)
          private val GREEN = Color(0xFF00E676)
          private val SOFT = Color(0xFF91A79E)

          data class TaskItem(
              val id: Long,
              val title: String,
              val date: String,
              val priority: String,
              val done: Boolean
          )

          data class EventItem(
              val id: Long,
              val title: String,
              val date: String,
              val time: String
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { NexaApp() }
              }
          }

          fun saveTasks(context: Context, tasks: List<TaskItem>) {
              val data = tasks.joinToString("§") {
                  "${it.id}|${it.title.replace("|"," ")}|${it.date}|${it.priority}|${it.done}"
              }
              context.getSharedPreferences("nexa", Context.MODE_PRIVATE)
                  .edit().putString("tasks", data).apply()
          }

          fun loadTasks(context: Context): List<TaskItem> {
              val data = context.getSharedPreferences("nexa", Context.MODE_PRIVATE)
                  .getString("tasks", "") ?: ""

              if (data.isBlank()) return emptyList()

              return data.split("§").mapNotNull {
                  val p = it.split("|")
                  if (p.size >= 5)
                      TaskItem(
                          p[0].toLongOrNull() ?: 0,
                          p[1],
                          p[2],
                          p[3],
                          p[4].toBoolean()
                      )
                  else null
              }
          }

          fun saveEvents(context: Context, events: List<EventItem>) {
              val data = events.joinToString("§") {
                  "${it.id}|${it.title.replace("|"," ")}|${it.date}|${it.time}"
              }
              context.getSharedPreferences("nexa", Context.MODE_PRIVATE)
                  .edit().putString("events", data).apply()
          }

          fun loadEvents(context: Context): List<EventItem> {
              val data = context.getSharedPreferences("nexa", Context.MODE_PRIVATE)
                  .getString("events", "") ?: ""

              if (data.isBlank()) return emptyList()

              return data.split("§").mapNotNull {
                  val p = it.split("|")
                  if (p.size >= 4)
                      EventItem(
                          p[0].toLongOrNull() ?: 0,
                          p[1],
                          p[2],
                          p[3]
                      )
                  else null
              }
          }

          fun openUrl(context: Context, url: String) {
              try {
                  context.startActivity(
                      Intent(Intent.ACTION_VIEW, Uri.parse(url))
                  )
              } catch (_: Exception) {
                  Toast.makeText(
                      context,
                      "Não foi possível abrir o serviço.",
                      Toast.LENGTH_SHORT
                  ).show()
              }
          }

          fun openWhatsApp(context: Context) {
              try {
                  val intent = Intent(Intent.ACTION_VIEW, Uri.parse("https://wa.me/"))
                  intent.setPackage("com.whatsapp")
                  context.startActivity(intent)
              } catch (_: Exception) {
                  openUrl(context, "https://www.whatsapp.com/")
              }
          }

          fun startVoice(context: Context) {
              try {
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  intent.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                      RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                  )
                  intent.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE,
                      "pt-BR"
                  )
                  intent.putExtra(
                      RecognizerIntent.EXTRA_PROMPT,
                      "Fale com a NEXA"
                  )
                  context.startActivity(intent)
              } catch (_: Exception) {
                  Toast.makeText(
                      context,
                      "Reconhecimento de voz indisponível.",
                      Toast.LENGTH_SHORT
                  ).show()
              }
          }

          @Composable
          fun NexaApp() {

              val context = LocalContext.current

              var tab by remember { mutableIntStateOf(0) }
              var tasks by remember { mutableStateOf(loadTasks(context)) }
              var events by remember { mutableStateOf(loadEvents(context)) }

              val tabs = listOf(
                  Triple("Início", Icons.Default.Home, 0),
                  Triple("Agenda", Icons.Default.DateRange, 1),
                  Triple("NEXA", Icons.Default.AutoAwesome, 2),
                  Triple("Central", Icons.Default.GridView, 3),
                  Triple("Tarefas", Icons.Default.CheckCircle, 4)
              )

              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = GREEN,
                      background = BG,
                      surface = PANEL
                  )
              ) {

                  Scaffold(
                      containerColor = BG,
                      bottomBar = {

                          NavigationBar(
                              containerColor = Color(0xFF08110E)
                          ) {

                              tabs.forEach { item ->

                                  NavigationBarItem(
                                      selected = tab == item.third,
                                      onClick = { tab = item.third },
                                      icon = {
                                          Icon(
                                              item.second,
                                              item.first
                                          )
                                      },
                                      label = {
                                          Text(
                                              item.first,
                                              fontSize = 10.sp
                                          )
                                      },
                                      colors = NavigationBarItemDefaults.colors(
                                          selectedIconColor = GREEN,
                                          selectedTextColor = GREEN,
                                          indicatorColor = PANEL2,
                                          unselectedIconColor = SOFT,
                                          unselectedTextColor = SOFT
                                      )
                                  )
                              }
                          }
                      }
                  ) { padding ->

                      Box(
                          Modifier
                              .padding(padding)
                              .fillMaxSize()
                      ) {

                          when (tab) {

                              0 -> HomeScreen(
                                  tasks,
                                  events,
                                  openAgenda = { tab = 1 },
                                  openTasks = { tab = 4 },
                                  openNexa = { tab = 2 }
                              )

                              1 -> AgendaScreen(
                                  events = events,
                                  onChange = {
                                      events = it
                                      saveEvents(context, events)
                                  }
                              )

                              2 -> NexaScreen()

                              3 -> CentralScreen()

                              4 -> TaskScreen(
                                  tasks = tasks,
                                  onChange = {
                                      tasks = it
                                      saveTasks(context, tasks)
                                  }
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          fun Header(
              title: String,
              subtitle: String
          ) {

              val context = LocalContext.current

              Row(
                  Modifier
                      .fillMaxWidth()
                      .padding(bottom = 24.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {

                  Surface(
                      modifier = Modifier.size(50.dp),
                      shape = RoundedCornerShape(17.dp),
                      color = GREEN
                  ) {
                      Box(
                          contentAlignment = Alignment.Center
                      ) {
                          Text(
                              "N",
                              color = BG,
                              fontSize = 29.sp,
                              fontWeight = FontWeight.Black
                          )
                      }
                  }

                  Spacer(Modifier.width(14.dp))

                  Column(
                      Modifier.weight(1f)
                  ) {

                      Text(
                          title,
                          color = Color.White,
                          fontSize = 24.sp,
                          fontWeight = FontWeight.Bold
                      )

                      Text(
                          subtitle,
                          color = SOFT,
                          fontSize = 12.sp
                      )
                  }

                  IconButton(
                      onClick = {
                          Toast.makeText(
                              context,
                              "Nenhum alerta pendente.",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  ) {
                      Icon(
                          Icons.Default.Notifications,
                          "Alertas",
                          tint = GREEN
                      )
                  }
              }
          }

          @Composable
          fun Page(
              content: @Composable ColumnScope.() -> Unit
          ) {
              Column(
                  Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(20.dp),
                  content = content
              )
          }

          @Composable
          fun NexaCard(
              onClick: (() -> Unit)? = null,
              content: @Composable ColumnScope.() -> Unit
          ) {

              val modifier =
                  if (onClick != null)
                      Modifier
                          .fillMaxWidth()
                          .padding(vertical = 6.dp)
                          .clickable { onClick() }
                  else
                      Modifier
                          .fillMaxWidth()
                          .padding(vertical = 6.dp)

              Card(
                  modifier = modifier,
                  colors = CardDefaults.cardColors(
                      containerColor = PANEL
                  ),
                  shape = RoundedCornerShape(22.dp)
              ) {

                  Column(
                      Modifier.padding(18.dp),
                      content = content
                  )
              }
          }

          @Composable
          fun HomeScreen(
              tasks: List<TaskItem>,
              events: List<EventItem>,
              openAgenda: () -> Unit,
              openTasks: () -> Unit,
              openNexa: () -> Unit
          ) = Page {

              Header(
                  "Meu Dia",
                  "NEXA • sua rotina em um só lugar"
              )

              Text(
                  "VISÃO GERAL",
                  color = GREEN,
                  fontWeight = FontWeight.Bold,
                  fontSize = 12.sp
              )

              NexaCard {
                  Text(
                      "Tudo sob controle",
                      fontSize = 20.sp,
                      fontWeight = FontWeight.Bold
                  )

                  Spacer(Modifier.height(6.dp))

                  Text(
                      "${events.size} compromisso(s) • ${tasks.count { !it.done }} tarefa(s) pendente(s)",
                      color = SOFT
                  )
              }

              Spacer(Modifier.height(12.dp))

              Text(
                  "PRÓXIMOS",
                  color = SOFT,
                  fontWeight = FontWeight.Bold,
                  fontSize = 12.sp
              )

              NexaCard(onClick = openAgenda) {

                  Row(
                      verticalAlignment = Alignment.CenterVertically
                  ) {

                      Icon(
                          Icons.Default.CalendarToday,
                          null,
                          tint = GREEN
                      )

                      Spacer(Modifier.width(14.dp))

                      Column {
                          Text(
                              "Agenda",
                              fontWeight = FontWeight.Bold
                          )

                          Text(
                              if (events.isEmpty())
                                  "Nenhum compromisso criado."
                              else
   
