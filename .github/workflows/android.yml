name: NEXA APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "NEXA_ANDROID_PROJECT.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: BAIXAR PROJETO
        uses: actions/checkout@v4

      - name: EXTRAIR NEXA
        run: |
          rm -rf nexa
          unzip -q NEXA_ANDROID_PROJECT.zip
          test -f nexa/settings.gradle
          test -f nexa/app/build.gradle

      - name: CONFIGURAR JAVA
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: CONFIGURAR GRADLE
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: COMPILAR APK
        working-directory: nexa
        run: gradle --no-daemon assembleDebug

      - name: CONFIRMAR APK
        run: |
          test -f nexa/app/build/outputs/apk/debug/app-debug.apk
          ls -lh nexa/app/build/outputs/apk/debug/app-debug.apk

      - name: PUBLICAR APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-1.0-APK
          path: nexa/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
