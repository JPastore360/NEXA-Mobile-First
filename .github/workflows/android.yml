name: NEXA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: CRIAR NEXA
        run: |
          rm -rf nexa
          mkdir -p nexa/app/src/main/java/com/jpastore/nexa

          cat > nexa/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='NEXA'
          include ':app'
          EOF

          cat > nexa/build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > nexa/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > nexa/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
            namespace 'com.jpastore.nexa'
            compileSdk 35

            defaultConfig {
              applicationId 'com.jpastore.nexa'
              minSdk 26
              targetSdk 35
              versionCode 8
              versionName '0.8'
            }
          }
          EOF

          cat > nexa/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application
              android:theme="@style/AppTheme"
              android:label="NEXA">
              <activity
                android:name=".MainActivity"
                android:screenOrientation="portrait"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          mkdir -p nexa/app/src/main/res/values

          cat > nexa/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#00E676</item>
              <item name="android:statusBarColor">#050B09</item>
              <item name="android:navigationBarColor">#050B09</item>
              <item name="android:windowLightStatusBar">false</item>
            </style>
          </resources>
          EOF

          cat > nexa/app/src/main/java/com/jpastore/nexa/MainActivity.java <<'EOF'
          package com.jpastore.nexa;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.Color;
          import android.net.Uri;
          import android.speech.RecognizerIntent;
          import android.view.*;
          import android.widget.*;
          import java.util.*;

          public class MainActivity extends Activity {

            int green=Color.rgb(0,230,118);
            int bg=Color.rgb(5,11,9);
            int panel=Color.rgb(13,23,20);
            LinearLayout body;
            ArrayList<String> tasks=new ArrayList<>();
            ArrayList<String> agenda=new ArrayList<>();

            @Override
            public void onCreate(Bundle b){
              super.onCreate(b);
              home();
            }

            TextView text(String s,int size,int color){
              TextView v=new TextView(this);
              v.setText(s);
              v.setTextSize(size);
              v.setTextColor(color);
              v.setPadding(20,18,20,18);
              return v;
            }

            Button button(String s){
              Button b=new Button(this);
              b.setText(s);
              b.setTextColor(bg);
              b.setBackgroundColor(green);
              return b;
            }

            void base(String title){
              LinearLayout root=new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              root.setBackgroundColor(bg);

              TextView logo=text("NEXA",30,green);
              logo.setGravity(Gravity.CENTER);
              root.addView(logo);

              root.addView(text(title,24,Color.WHITE));

              ScrollView scroll=new ScrollView(this);
              body=new LinearLayout(this);
              body.setOrientation(LinearLayout.VERTICAL);
              body.setPadding(20,10,20,20);
              scroll.addView(body);

              root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));

              LinearLayout nav=new LinearLayout(this);
              nav.setOrientation(LinearLayout.HORIZONTAL);

              String[] names={"Início","Agenda","NEXA","Central","Tarefas"};

              for(String n:names){
                Button x=new Button(this);
                x.setText(n);
                x.setTextSize(11);
                x.setTextColor(Color.WHITE);
                x.setBackgroundColor(panel);

                x.setOnClickListener(v->{
                  if(n.equals("Início")) home();
                  if(n.equals("Agenda")) agenda();
                  if(n.equals("NEXA")) voice();
                  if(n.equals("Central")) central();
                  if(n.equals("Tarefas")) tasks();
                });

                nav.addView(x,new LinearLayout.LayoutParams(0,70,1));
              }

              root.addView(nav);
              setContentView(root);
            }

            void card(String a,String b){
              LinearLayout c=new LinearLayout(this);
              c.setOrientation(LinearLayout.VERTICAL);
              c.setPadding(15,10,15,10);
              c.setBackgroundColor(panel);
              c.addView(text(a,18,Color.WHITE));
              c.addView(text(b,14,Color.LTGRAY));

              LinearLayout.LayoutParams p=
                new LinearLayout.LayoutParams(-1,-2);
              p.setMargins(0,8,0,8);
              body.addView(c,p);
            }

            void home(){
              base("Meu Dia");
              card("Tudo sob controle","Sua central pessoal NEXA.");
              card("Agenda","Compromissos e horários.");
              card("Tarefas","Prioridades e atividades.");

              Button b=button("FALAR COM A NEXA");
              b.setOnClickListener(v->voice());
              body.addView(b);
            }

            void agenda(){
              base("Agenda");

              for(String s:agenda)
                card(s,"Compromisso");

              Button b=button("+ NOVO COMPROMISSO");
              b.setOnClickListener(v->addItem(true));
              body.addView(b);
            }

            void tasks(){
              base("Tarefas");

              for(String s:tasks)
                card(s,"Tarefa");

              Button b=button("+ NOVA TAREFA");
              b.setOnClickListener(v->addItem(false));
              body.addView(b);
            }

            void addItem(boolean isAgenda){
              final EditText input=new EditText(this);
              input.setTextColor(Color.WHITE);
              input.setHintTextColor(Color.GRAY);
              input.setHint(isAgenda ? "Compromisso" : "Tarefa");

              new AlertDialog.Builder(this)
                .setTitle(isAgenda ? "Novo compromisso" : "Nova tarefa")
                .setView(input)
                .setPositiveButton("Salvar",(d,w)->{
                  String s=input.getText().toString().trim();

                  if(!s.isEmpty()){
                    if(isAgenda){
                      agenda.add(s);
                      agenda();
                    } else {
                      tasks.add(s);
                      tasks();
                    }
                  }
                })
                .setNegativeButton("Cancelar",null)
                .show();
            }

            void voice(){
              base("NEXA");
              card("Como posso ajudar?","Toque abaixo e fale com a NEXA.");

              Button b=button("🎤 TOCAR PARA FALAR");

              b.setOnClickListener(v->{
                try{
                  Intent i=new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  i.putExtra(
                    RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                    RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                  );
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE,"pt-BR");
                  startActivityForResult(i,99);
                }catch(Exception e){
                  Toast.makeText(this,"Reconhecimento de voz indisponível",Toast.LENGTH_LONG).show();
                }
              });

              body.addView(b);
            }

            @Override
            protected void onActivityResult(int request,int result,Intent data){
              super.onActivityResult(request,result,data);

              if(request==99 && result==RESULT_OK && data!=null){
                ArrayList<String> r=data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);

                if(r!=null && !r.isEmpty()){
                  voice();
                  card("Você disse:",r.get(0));
                }
              }
            }

            void central(){
              base("Central");

              service("Google","https://myaccount.google.com");
              service("Google Agenda","https://calendar.google.com");
              service("Google Drive","https://drive.google.com");
              service("WhatsApp","https://wa.me/");
              service("Instagram","https://www.instagram.com");
              service("Facebook","https://www.facebook.com");
              service("ChatGPT","https://chatgpt.com");
            }

            void service(String name,String url){
              Button b=button(name);
              b.setOnClickListener(v->{
                try{
                  startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse(url)));
                }catch(Exception e){}
              });

              LinearLayout.LayoutParams p=
                new LinearLayout.LayoutParams(-1,-2);
              p.setMargins(0,8,0,8);
              body.addView(b,p);
            }
          }
          EOF

      - name: COMPILAR APK
        working-directory: nexa
        run: gradle --no-daemon assembleDebug

      - name: CONFIRMAR APK
        run: |
          test -f nexa/app/build/outputs/apk/debug/app-debug.apk
          ls -lh nexa/app/build/outputs/apk/debug/app-debug.apk

      - name: PUBLICAR APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-v0.8-APK
          path: nexa/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
