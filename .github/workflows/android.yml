name: NEXA APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nexa/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: BAIXAR PROJETO
        uses: actions/checkout@v4

      - name: CONFIGURAR JAVA
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: CONFIGURAR GRADLE
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: COMPILAR APK
        working-directory: nexa
        run: gradle --no-daemon assembleDebug

      - name: CONFIRMAR APK
        run: test -f nexa/app/build/outputs/apk/debug/app-debug.apk

      - name: PUBLICAR APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-APK
          path: nexa/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
