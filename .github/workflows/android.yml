name: Build NEXA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir nexa
          unzip -q NEXA-Mobile-First-Base.zip -d nexa

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar NEXA
        working-directory: nexa
        run: gradle --stacktrace --no-daemon assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-APK
          path: nexa/app/build/outputs/apk/debug/app-debug.apk
