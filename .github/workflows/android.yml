          }

          @Composable
          fun HomeScreen(
              openAgenda: () -> Unit,
              openNexa: () -> Unit,
              openTasks: () -> Unit
          ) {

              Page(
                  title = "Meu Dia",
                  subtitle =
                      "NEXA • sua rotina em um só lugar"
              ) {

                  Text(
