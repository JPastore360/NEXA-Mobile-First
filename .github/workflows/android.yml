                          }
                      }

                      Spacer(
                          Modifier.width(14.dp)
                      )

                      Column {

                          Text(
                              title,
                              color = Color.White,
                              fontSize = 25.sp,
                              fontWeight =
                                  FontWeight.Bold
                          )

                          Text(
                              subtitle,
                              color = SOFT,
                              fontSize = 12.sp
                          )
                      }
                  }

                  Spacer(
                      Modifier.height(25.dp)
                  )

                  content()
              }
          }

          @Composable
          fun NexaCard(
              title: String,
              subtitle: String,
              onClick: () -> Unit = {}
          ) {

              Card(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(vertical = 6.dp)
                      .clickable {
                          onClick()
                      },

                  colors =
                      CardDefaults.cardColors(
                          containerColor = PANEL
                      ),

                  shape =
                      RoundedCornerShape(21.dp)
              ) {

                  Column(
                      modifier =
                          Modifier.padding(18.dp)
                  ) {

                      Text(
                          title,
                          color = Color.White,
                          fontSize = 17.sp,
                          fontWeight =
                              FontWeight.Bold
                      )

                      Spacer(
                          Modifier.height(4.dp)
                      )

                      Text(
                          subtitle,
                          color = SOFT
                      )
