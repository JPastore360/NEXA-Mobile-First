          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import org.json.JSONArray
          import org.json.JSONObject
          import java.time.LocalDate

          private val NexaBackground = Color(0xFF050B09)
          private val NexaPanel = Color(0xFF0D1714)
          private val NexaPanelLight = Color(0xFF14241E)
          private val NexaGreen = Color(0xFF00E676)
          private val NexaTextSecondary = Color(0xFF93A79F)

          data class TaskItem(
              val id: Long,
              val title: String,
              val note: String,
              val date: String,
              val time: String,
              val priority: String,
              val done: Boolean
          )

          data class EventItem(
              val id: Long,
              val title: String,
              val date: String,
              val time: String,
              val note: String
          )

          object NexaStore {

              private const val PREFS = "nexa_storage"
              private const val TASKS = "tasks"
              private const val EVENTS = "events"

              private fun prefs(context: Context) =
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              fun saveTasks(
                  context: Context,
                  tasks: List<TaskItem>
              ) {
                  val array = JSONArray()

                  tasks.forEach { task ->
                      array.put(
                          JSONObject()
                              .put("id", task.id)
                              .put("title", task.title)
                              .put("note", task.note)
                              .put("date", task.date)
                              .put("time", task.time)
                              .put("priority", task.priority)
                              .put("done", task.done)
                      )
                  }

                  prefs(context)
                      .edit()
                      .putString(TASKS, array.toString())
                      .apply()
              }

              fun loadTasks(context: Context): List<TaskItem> {
                  return try {
                      val text =
                          prefs(context).getString(TASKS, "[]") ?: "[]"

                      val array = JSONArray(text)

                      buildList {
                          for (i in 0 until array.length()) {
                              val obj = array.getJSONObject(i)

                              add(
                                  TaskItem(
                                      id = obj.optLong("id"),
                                      title = obj.optString("title"),
                                      note = obj.optString("note"),
                                      date = obj.optString("date"),
                                      time = obj.optString("time"),
                                      priority = obj.optString(
                                          "priority",
                                          "Normal"
                                      ),
                                      done = obj.optBoolean("done")
                                  )
                              )
                          }
                      }
                  } catch (_: Exception) {
                      emptyList()
                  }
              }

              fun saveEvents(
                  context: Context,
                  events: List<EventItem>
              ) {
                  val array = JSONArray()

                  events.forEach { event ->
                      array.put(
                          JSONObject()
                              .put("id", event.id)
                              .put("title", event.title)
                              .put("date", event.date)
                              .put("time", event.time)
                              .put("note", event.note)
                      )
                  }

                  prefs(context)
                      .edit()
                      .putString(EVENTS, array.toString())
                      .apply()
              }

              fun loadEvents(context: Context): List<EventItem> {
                  return try {
                      val text =
                          prefs(context).getString(EVENTS, "[]") ?: "[]"

                      val array = JSONArray(text)

                      buildList {
                          for (i in 0 until array.length()) {
                              val obj = array.getJSONObject(i)

                              add(
                                  EventItem(
                                      id = obj.optLong("id"),
                                      title = obj.optString("title"),
                                      date = obj.optString("date"),
                                      time = obj.optString("time"),
                                      note = obj.optString("note")
                                  )
                              )
                          }
                      }
                  } catch (_: Exception) {
                      emptyList()
                  }
              }
          }

          class MainActivity : ComponentActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  setContent {
                      NexaApp()
                  }
              }
          }

          @Composable
          fun NexaApp() {

              val context = LocalContext.current

              var selectedTab by remember {
                  mutableIntStateOf(0)
              }

              var tasks by remember {
                  mutableStateOf(
                      NexaStore.loadTasks(context)
                  )
              }

              var events by remember {
                  mutableStateOf(
                      NexaStore.loadEvents(context)
                  )
              }

              var showAlerts by remember {
                  mutableStateOf(false)
              }

              val pendingTasks =
                  tasks.count { !it.done }

              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = NexaGreen,
                      background = NexaBackground,
                      surface = NexaPanel
                  )
              ) {

                  Scaffold(
                      containerColor = NexaBackground,

                      bottomBar = {

