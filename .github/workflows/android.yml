name: Build NEXA Original

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar projeto NEXA
        run: |
          rm -rf nexa
          mkdir -p nexa/app/src/main/java/com/jpastore/nexa
          mkdir -p nexa/app/src/main/res/values

          cat > nexa/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NEXA"
          include(":app")
          EOF

          cat > nexa/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > nexa/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > nexa/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.jpastore.nexa"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.jpastore.nexa"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "0.2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material:material-icons-extended")
          }
          EOF

          cat > nexa/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.Nexa" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">#050B09</item>
                  <item name="android:navigationBarColor">#050B09</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > nexa/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:theme="@style/Theme.Nexa"
                  android:label="NEXA">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > nexa/app/src/main/java/com/jpastore/nexa/MainActivity.kt <<'EOF'
          package com.jpastore.nexa

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          private val Bg = Color(0xFF050B09)
          private val Panel = Color(0xFF0C1713)
          private val Panel2 = Color(0xFF12221C)
          private val Green = Color(0xFF00E676)
          private val Soft = Color(0xFF91A79E)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { NexaApp() }
              }
          }

          data class NexaTab(
              val name: String,
              val icon: ImageVector
          )

          @Composable
          fun NexaApp() {
              val tabs = listOf(
                  NexaTab("Início", Icons.Default.Home),
                  NexaTab("Agenda", Icons.Default.DateRange),
                  NexaTab("NEXA", Icons.Default.AutoAwesome),
                  NexaTab("Central", Icons.Default.GridView),
                  NexaTab("Tarefas", Icons.Default.CheckCircle)
              )

              var selected by remember { mutableIntStateOf(0) }

              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = Green,
                      background = Bg,
                      surface = Panel
                  )
              ) {
                  Scaffold(
                      containerColor = Bg,
                      bottomBar = {
                          NavigationBar(
                              containerColor = Color(0xFF08110E)
                          ) {
                              tabs.forEachIndexed { index, tab ->
                                  NavigationBarItem(
                                      selected = selected == index,
                                      onClick = { selected = index },
                                      icon = {
                                          Icon(
                                              tab.icon,
                                              contentDescription = tab.name
                                          )
                                      },
                                      label = {
                                          Text(tab.name, fontSize = 10.sp)
                                      },
                                      colors = NavigationBarItemDefaults.colors(
                                          selectedIconColor = Green,
                                          selectedTextColor = Green,
                                          indicatorColor = Panel2,
                                          unselectedIconColor = Soft,
                                          unselectedTextColor = Soft
                                      )
                                  )
                              }
                          }
                      }
                  ) { padding ->

                      Box(
                          Modifier
                              .padding(padding)
                              .fillMaxSize()
                      ) {
                          when (selected) {
                              0 -> Inicio()
                              1 -> Agenda()
                              2 -> Assistente()
                              3 -> Central()
                              4 -> Tarefas()
                          }
                      }
                  }
              }
          }

          @Composable
          fun Cabecalho(
              titulo: String,
              subtitulo: String
          ) {
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(bottom = 24.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(
                      modifier = Modifier
                          .size(50.dp)
                          .background(
                              Brush.radialGradient(
                                  listOf(
                                      Green,
                                      Color(0xFF075B3B)
                                  )
                              ),
                              RoundedCornerShape(17.dp)
                          ),
                      contentAlignment = Alignment.Center
                  ) {
                      Text(
                          "N",
                          color = Bg,
                          fontSize = 29.sp,
                          fontWeight = FontWeight.Black
                      )
                  }

                  Spacer(Modifier.width(14.dp))

                  Column(
                      Modifier.weight(1f)
                  ) {
                      Text(
                          titulo,
                          color = Color.White,
                          fontSize = 24.sp,
                          fontWeight = FontWeight.Bold
                      )

                      Text(
                          subtitulo,
                          color = Soft,
                          fontSize = 12.sp
                      )
                  }

                  Icon(
                      Icons.Default.Notifications,
                      contentDescription = null,
                      tint = Green
                  )
              }
          }

          @Composable
          fun Pagina(
              content: @Composable ColumnScope.() -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(20.dp),
                  content = content
              )
          }

          @Composable
          fun NexaCard(
              content: @Composable ColumnScope.() -> Unit
          ) {
              Card(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(vertical = 6.dp),
                  colors = CardDefaults.cardColors(
                      containerColor = Panel
                  ),
                  shape = RoundedCornerShape(22.dp)
              ) {
                  Column(
                      Modifier.padding(18.dp),
                      content = content
                  )
              }
          }

          @Composable
          fun Inicio() = Pagina {

              Cabecalho(
                  "Meu Dia",
                  "NEXA • sua rotina em um só lugar"
              )

              Text(
                  "VISÃO GERAL",
                  color = Green,
                  fontSize = 12.sp,
                  fontWeight = FontWeight.Bold
              )

              NexaCard {
                  Text(
                      "Tudo sob controle",
                      fontSize = 20.sp,
                      fontWeight = FontWeight.Bold
                  )

                  Spacer(Modifier.height(7.dp))

                  Text(
                      "Agenda, tarefas, alertas e informações importantes reunidas pela NEXA.",
                      color = Soft
                  )
              }

              Spacer(Modifier.height(14.dp))

              Text(
                  "PRÓXIMOS",
                  color = Soft,
                  fontSize = 12.sp,
                  fontWeight = FontWeight.Bold
              )

              NexaCard {
                  Row(
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Icon(
                          Icons.Default.CalendarToday,
                          null,
                          tint = Green
                      )

                      Spacer(Modifier.width(14.dp))

                      Column {
                          Text(
                              "Agenda",
                              fontWeight = FontWeight.Bold
                          )

                          Text(
                              "Nenhum compromisso sincronizado.",
                              color = Soft,
                              fontSize = 13.sp
                          )
                      }
                  }
              }

              NexaCard {
                  Row(
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Icon(
                          Icons.Default.CheckCircle,
                          null,
                          tint = Green
                      )

                      Spacer(Modifier.width(14.dp))

                      Column {
                          Text(
                              "Tarefas",
                              fontWeight = FontWeight.Bold
                          )

                          Text(
                              "Nenhuma tarefa pendente.",
                              color = Soft,
                              fontSize = 13.sp
                          )
                      }
                  }
              }

              Spacer(Modifier.height(16.dp))

              Button(
                  onClick = {},
                  modifier = Modifier.fillMaxWidth(),
                  colors = ButtonDefaults.buttonColors(
                      containerColor = Green
                  )
              ) {
                  Icon(
                      Icons.Default.AutoAwesome,
                      null,
                      tint = Bg
                  )

                  Spacer(Modifier.width(8.dp))

                  Text(
                      "Falar com a NEXA",
                      color = Bg,
                      fontWeight = FontWeight.Bold
                  )
              }
          }

          @Composable
          fun Agenda() = Pagina {

              Cabecalho(
                  "Agenda",
                  "Compromissos e lembretes"
              )

              Row(
                  Modifier.fillMaxWidth(),
                  horizontalArrangement = Arrangement.spacedBy(8.dp)
              ) {
                  listOf(
                      "Hoje",
                      "Amanhã",
                      "Semana"
                  ).forEachIndexed { index, texto ->

                      Surface(
                          color = if (index == 0) Green else Panel2,
                          shape = RoundedCornerShape(14.dp)
                      ) {
                          Text(
                              texto,
                              color = if (index == 0) Bg else Color.White,
                              modifier = Modifier.padding(
                                  horizontal = 16.dp,
                                  vertical = 10.dp
                              ),
                              fontWeight = FontWeight.Bold
                          )
                      }
                  }
              }

              Spacer(Modifier.height(18.dp))

              NexaCard {
                  Text(
                      "Sua agenda está pronta",
                      fontWeight = FontWeight.Bold
                  )

                  Spacer(Modifier.height(6.dp))

                  Text(
                      "Os compromissos reais aparecerão aqui quando sua conta for conectada.",
                      color = Soft
                  )
              }

              Button(
                  onClick = {},
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(top = 12.dp),
                  colors = ButtonDefaults.buttonColors(
                      containerColor = Green
                  )
              ) {
                  Text(
                      "＋ Novo compromisso",
                      color = Bg,
                      fontWeight = FontWeight.Bold
                  )
              }
          }

          @Composable
          fun Assistente() {

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(
                          Brush.radialGradient(
                              colors = listOf(
                                  Color(0xFF0C3B2A),
                                  Bg
                              ),
                              radius = 900f
                          )
                      ),
                  contentAlignment = Alignment.Center
              ) {

                  Column(
                      horizontalAlignment = Alignment.CenterHorizontally,
                      modifier = Modifier.padding(28.dp)
                  ) {

                      Text(
                          "NEXA",
                          color = Green,
                          fontSize = 15.sp,
                          fontWeight = FontWeight.Bold
                      )

                      Spacer(Modifier.height(30.dp))

                      Surface(
                          modifier = Modifier.size(180.dp),
                          color = Green.copy(alpha = .10f),
                          shape = CircleShape,
                          border = androidx.compose.foundation.BorderStroke(
                              2.dp,
                              Green.copy(alpha = .55f)
                          )
                      ) {
                          Box(
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(
                                  Icons.Default.Mic,
                                  contentDescription = "Falar",
                                  tint = Green,
                                  modifier = Modifier.size(68.dp)
                              )
                          }
                      }

                      Spacer(Modifier.height(30.dp))

                      Text(
                          "Como posso ajudar?",
                          fontSize = 27.sp,
                          fontWeight = FontWeight.Bold
                      )

                      Spacer(Modifier.height(8.dp))

                      Text(
                          "Toque no microfone para conversar com a NEXA",
                          color = Soft
                      )
                  }
              }
          }

          @Composable
          fun Central() = Pagina {

              Cabecalho(
                  "Central",
                  "Serviços e integrações"
              )

              val servicos = listOf(
                  Triple(
                      "Google",
                      "Gmail • Agenda • Drive",
                      Icons.Default.AccountCircle
                  ),
                  Triple(
                      "WhatsApp",
                      "Mensagens e notificações",
                      Icons.Default.Chat
                  ),
                  Triple(
                      "Redes sociais",
                      "Instagram • Facebook",
                      Icons.Default.Public
                  ),
                  Triple(
                      "ChatGPT",
                      "Inteligência da NEXA",
                      Icons.Default.AutoAwesome
                  )
              )

              servicos.forEach { item ->

                  NexaCard {
                      Row(
                          verticalAlignment = Alignment.CenterVertically
                      ) {

                          Icon(
                              item.third,
                              null,
                              tint = Green,
                              modifier = Modifier.size(32.dp)
                          )

                          Spacer(Modifier.width(14.dp))

                          Column(
                              Modifier.weight(1f)
                          ) {
                              Text(
                                  item.first,
                                  fontWeight = FontWeight.Bold
                              )

                              Text(
                                  item.second,
                                  color = Soft,
                                  fontSize = 12.sp
                              )
                          }

                          Text(
                              "Conectar",
                              color = Green,
                              fontSize = 12.sp,
                              fontWeight = FontWeight.Bold
                          )
                      }
                  }
              }
          }

          @Composable
          fun Tarefas() = Pagina {

              Cabecalho(
                  "Tarefas",
                  "Prioridades e lembretes"
              )

              var tarefas by remember {
                  mutableStateOf(
                      emptyList<Pair<String, Boolean>>()
                  )
              }

              NexaCard {

                  if (tarefas.isEmpty()) {

                      Text(
                          "Tudo em ordem",
                          fontWeight = FontWeight.Bold
                      )

                      Spacer(Modifier.height(6.dp))

                      Text(
                          "Você ainda não criou tarefas.",
                          color = Soft
                      )

                  } else {

                      tarefas.forEachIndexed { index, tarefa ->

                          Row(
                              verticalAlignment = Alignment.CenterVertically
                          ) {

                              Checkbox(
                                  checked = tarefa.second,
                                  onCheckedChange = { marcado ->

                                      tarefas =
                                          tarefas.toMutableList().also {
                                              it[index] =
                                                  tarefa.first to marcado
                                          }
                                  }
                              )

                              Text(tarefa.first)
                          }
                      }
                  }
              }

              Button(
                  onClick = {
                      tarefas =
                          tarefas + ("Nova tarefa" to false)
                  },
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(top = 12.dp),
                  colors = ButtonDefaults.buttonColors(
                      containerColor = Green
                  )
              ) {

                  Text(
                      "＋ Adicionar tarefa",
                      color = Bg,
                      fontWeight = FontWeight.Bold
                  )
              }

              Spacer(Modifier.height(16.dp))

              Text(
                  "Alertas inteligentes • 1 dia • horas • 30 min • 10 min • horário exato",
                  color = Soft,
                  fontSize = 12.sp
              )
          }
          EOF

      - name: Compilar NEXA
        working-directory: nexa
        run: gradle --stacktrace --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-Original-v0.2
          path: nexa/app/build/outputs/apk/debug/app-debug.apk
