                  Spacer(
                      Modifier.height(14.dp)
                  )

                  Button(
                      onClick = openNexa,
                      modifier =
                          Modifier.fillMaxWidth(),

                      colors =
                          ButtonDefaults.buttonColors(
                              containerColor = GREEN
